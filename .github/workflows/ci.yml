name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: secret-scan
        working-directory: ${{ github.workspace }}
        run: |
          if git grep -n -E "(sk-|gsk_|sbp_)[A-Za-z0-9]{20,}|AQ\.Ab8.{8,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|xoxb-[0-9]+-[0-9]+-[A-Za-z0-9]+" -- .; then
            echo "secret pattern found in tracked files" >&2
            exit 1
          fi
