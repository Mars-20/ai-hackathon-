name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: schema-hash
        working-directory: ${{ github.workspace }}
        run: node -e "const fs=require('fs'),c=require('crypto');for(const f of ['packages/db/schema-unified.sql','supabase/migrations/20240101000000_schema_unified.sql']){console.log(f,c.createHash('sha256').update(fs.readFileSync(f)).digest('hex').slice(0,12))}"

      - name: secret-scan
        working-directory: ${{ github.workspace }}
        run: |
          if git grep -n -E "(sk-|gsk_|sbp_)[A-Za-z0-9]{20,}|AQ\.Ab8.{8,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|xoxb-[0-9]+-[0-9]+-[A-Za-z0-9]+" -- .; then
            echo "secret pattern found in tracked files" >&2
            exit 1
          fi

  # Task 7: integration gates — e2e (playwright smoke) + deterministic eval
  # (golden tasks + meta-checks) + vitest coverage thresholds.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    # Smoke tests run against a real server: middleware + API routes construct
    # Supabase clients at request time and throw on missing env (500s). CI has
    # no .env.local, so inject obviously-fake values: logged-out behavior
    # (redirects to /login?next=, 401s) is identical with or without real keys.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_dummy_anon_key_not_a_secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Playwright smoke
        run: |
          npx playwright install --with-deps chromium
          export PW_CHROME_EXE=$(echo "$HOME/.cache/ms-playwright/chromium-"*/chrome-linux/chrome)
          npm run test:e2e

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22+: the harness shells out to `node --experimental-strip-types`
      # (eval/harness/assertions.mjs) to import apps/web/src/lib/utils.ts.
      # That flag exists only on 22.6+ — node 20 fails every bridge call.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Golden-task eval (8/8)
        working-directory: ${{ github.workspace }}
        run: node eval/run-eval.js

      - name: Eval meta-checks
        working-directory: ${{ github.workspace }}
        run: node --test eval/harness/meta.test.mjs

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Coverage gate (v8 thresholds)
        run: |
          npm install --no-save @vitest/coverage-v8
          npx vitest run --coverage
